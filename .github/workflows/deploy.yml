name: Deploy to GitHub Pages

# 운영(main)은 /AniMan/ 에, 열린 PR 은 /AniMan/pr-preview/pr-<번호>/ 에 배포한다.
# GitHub Pages 는 사이트 전체를 한 번에 교체하므로, 매 실행마다 main + 열린 PR 전부를 함께 빌드한다.
# (닫힌 PR 의 미리보기는 다음 배포에서 자동으로 사라진다)
#
# ⚠️ PR 이벤트에서 배포하려면 한 번만 설정이 필요하다:
#    Settings → Environments → github-pages → Deployment branches and tags 에
#    `refs/pull/*/merge` 규칙을 추가하거나 "No restriction" 을 선택.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # 포크 PR 은 시크릿이 없고 신뢰할 수 없으므로 배포하지 않는다.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      BASE_PATH: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build production (main)
        run: |
          npm ci
          npm run build -- --base "$BASE_PATH" --outDir "$RUNNER_TEMP/site" --emptyOutDir

      - name: Build previews for open pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_PR: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.number || '' }}
        run: |
          set -uo pipefail
          prs=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 30 \
                  --json number,isCrossRepository --jq '.[] | select(.isCrossRepository | not) | .number')
          trigger_failed=0
          for pr in $prs; do
            echo "::group::PR #$pr"
            dir="$RUNNER_TEMP/pr-$pr"
            if git fetch --quiet origin "pull/$pr/head:pr-$pr" \
               && git worktree add --quiet "$dir" "pr-$pr" \
               && (cd "$dir" && npm ci --no-audit --no-fund \
                   && VITE_PREVIEW_LABEL="PR #$pr" npm run build -- \
                        --base "${BASE_PATH}pr-preview/pr-$pr/" \
                        --outDir "$RUNNER_TEMP/site/pr-preview/pr-$pr" --emptyOutDir); then
              echo "✅ preview built for #$pr"
            else
              echo "::warning::PR #$pr preview build failed — skipped"
              rm -rf "$RUNNER_TEMP/site/pr-preview/pr-$pr"
              [ "$pr" = "$TRIGGER_PR" ] && trigger_failed=1
            fi
            echo "::endgroup::"
          done
          if [ -n "$TRIGGER_PR" ] && [ ! -d "$RUNNER_TEMP/site/pr-preview/pr-$TRIGGER_PR" ] && [ "$trigger_failed" = 0 ]; then
            echo "::error::PR #$TRIGGER_PR was not found among open PRs"; exit 1
          fi
          exit $trigger_failed

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' && format('{0}pr-preview/pr-{1}/', steps.deployment.outputs.page_url, github.event.number) || steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  comment:
    needs: deploy
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- animan-pr-preview -->';
            const url = `https://${context.repo.owner.toLowerCase()}.github.io/${context.repo.repo}/pr-preview/pr-${context.issue.number}/`;
            const body = `${marker}\n🔍 **PR 미리보기 배포 완료**\n\n${url}\n\n` +
              `커밋 \`${context.payload.pull_request.head.sha.slice(0, 7)}\` 기준 · 운영 사이트(main)는 그대로입니다. PR 을 닫거나 머지하면 미리보기는 자동으로 삭제됩니다.`;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number, per_page: 100 });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
