name: Export catalog from Supabase

# Supabase의 공개 시리즈 데이터를 src/data/series/*.json으로 내보내 현재 브랜치에 커밋한다.
# 키는 저장소 secrets(VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY)에서만 읽고 출력·저장하지 않는다.
# Actions 탭에서 수동 실행(Run workflow). 이전이 끝나면 이 파일을 지워도 된다.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Export catalog
        run: node scripts/export-supabase-catalog.mjs
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Commit catalog
        run: |
          git add src/data/series
          if git diff --cached --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Import catalog from Supabase"
          git push
